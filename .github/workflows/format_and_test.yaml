name: format_and_test

on:
  push:
    branches: ['main']
    paths:
      - 'Script/*'
      - 'Tools/*'
      - 'Test/**'
      - '**/*.yaml'
      - '**/*.yml'
      - '.prettierrc*'
  pull_request:
    paths:
      - 'Script/*'
      - 'Tools/*'
      - 'Test/**'
      - '**/*.yaml'
      - '**/*.yml'
      - '.prettierrc*'
  workflow_dispatch:

concurrency:
  group: format-and-test-${{ github.event.pull_request.number || github.ref }}
  cancel-in-progress: true

jobs:
  format:
    if: github.event_name != 'pull_request'
    permissions:
      contents: write

    runs-on: ubuntu-latest

    steps:
      - name: checkout code
        uses: actions/checkout@v6
        with:
          # 需要完整的远端引用：推送被拒后要 reset 到最新 origin 再重新生成
          fetch-depth: 0

      - name: setup Node.js
        uses: actions/setup-node@v6
        with:
          node-version: '24'

      - name: install tools
        run: npm install -g prettier

      # 生成 + 格式化的结果完全可由「最新远端 + 生成器 + prettier」复现，
      # 因此推送被拒时不做 rebase（生成区块几乎必然冲突），而是硬同步到最新 origin 后整轮重跑。
      - name: generate, format, commit and push changes
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"

          BRANCH="${GITHUB_REF_NAME}"

          for attempt in 1 2 3 4 5; do
            echo "::group::generate / format / commit / push（第 ${attempt} 次）"

            node Tools/generate-singbox-rules.js
            git ls-files -z '*.js' '*.yml' '*.yaml' | xargs -0 -r prettier --write

            git add -A

            if git diff --cached --quiet; then
              echo "no changes to commit"
              echo "::endgroup::"
              exit 0
            fi

            git commit -m "chore: auto format & sync sing-box rules"

            if git push origin "HEAD:${BRANCH}"; then
              echo "::endgroup::"
              exit 0
            fi

            echo "::endgroup::"
            echo "::warning::推送被拒（远端有新提交），同步到 origin/${BRANCH} 后重新生成"
            git rebase --abort 2>/dev/null || true
            git fetch origin "${BRANCH}"
            git reset --hard "origin/${BRANCH}"
          done

          echo "::error::连续 5 次推送被拒，放弃本次自动提交（请检查是否有其它高频提交源）"
          exit 1

  test:
    needs: format
    if: always() && (needs.format.result == 'success' || needs.format.result == 'skipped')
    runs-on: ubuntu-latest

    steps:
      - name: checkout code
        uses: actions/checkout@v6
        with:
          ref: ${{ github.event.pull_request.head.ref || github.ref }}
          repository: ${{ github.event.pull_request.head.repo.full_name || github.repository }}
          fetch-depth: 0

      - name: setup Node.js
        uses: actions/setup-node@v6
        with:
          node-version: '24'

      - name: install dependencies
        run: npm --prefix Test install

      # 校验生成区块是否与上游一致（不一致只告警，避免上游更新直接卡住 PR）
      - name: check sing-box rules freshness
        continue-on-error: true
        run: |
          if ! node Tools/generate-singbox-rules.js --check; then
            echo "::warning::Script/mihomoScript.js 的 sing-box-rules 生成区块与上游不一致，重新运行 generate 步骤即可"
          fi

      - name: run tests
        run: node Test/run-tests.js
