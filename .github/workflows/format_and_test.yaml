name: format_and_test

on:
  push:
    branches: ['main']
    paths:
      - 'Script/*'
      - 'Tools/*'
      - 'Test/**'
      - '**/*.yaml'
      - '**/*.yml'
      - '.prettierrc*'
  pull_request:
    paths:
      - 'Script/*'
      - 'Tools/*'
      - 'Test/**'
      - '**/*.yaml'
      - '**/*.yml'
      - '.prettierrc*'
  workflow_dispatch:

concurrency:
  group: format-and-test-${{ github.event.pull_request.number || github.ref }}
  cancel-in-progress: true

jobs:
  format:
    if: github.event_name != 'pull_request'
    permissions:
      contents: write

    runs-on: ubuntu-latest

    steps:
      - name: checkout code
        uses: actions/checkout@v6

      - name: setup Node.js
        uses: actions/setup-node@v6
        with:
          node-version: '24'

      - name: install tools
        run: npm install -g prettier

      # 拉取 resunne/sing-box-rules 的 baowu / sun-direct / sun-proxy 规则，
      # 转换成 mihomo 规则并写入 Script/mihomoScript.js 的生成区块
      - name: generate sing-box rules
        run: node Tools/generate-singbox-rules.js

      - name: format files
        run: |
          git ls-files -z '*.js' '*.yml' '*.yaml' | xargs -0 -r prettier --write

      - name: commit and push changes
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"

          git add .

          if git diff --cached --quiet; then
            echo "no changes to commit"
          else
            git commit -m "chore: auto format & sync sing-box rules"
            git push
          fi

  test:
    needs: format
    if: always() && (needs.format.result == 'success' || needs.format.result == 'skipped')
    runs-on: ubuntu-latest

    steps:
      - name: checkout code
        uses: actions/checkout@v6
        with:
          ref: ${{ github.event.pull_request.head.ref || github.ref }}
          repository: ${{ github.event.pull_request.head.repo.full_name || github.repository }}
          fetch-depth: 0

      - name: setup Node.js
        uses: actions/setup-node@v6
        with:
          node-version: '24'

      - name: install dependencies
        run: npm --prefix Test install

      # 校验生成区块是否与上游一致（不一致只告警，避免上游更新直接卡住 PR）
      - name: check sing-box rules freshness
        continue-on-error: true
        run: |
          if ! node Tools/generate-singbox-rules.js --check; then
            echo "::warning::Script/mihomoScript.js 的 sing-box-rules 生成区块与上游不一致，重新运行 generate 步骤即可"
          fi

      - name: run tests
        run: node Test/run-tests.js
